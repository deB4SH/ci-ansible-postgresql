name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockerhub.registry.macslabs.de/catthehacker/ubuntu:act-latest
    env:
      DOCKER_ORG: abell.registry.macslabs.de/docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all history for all branches and tags
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
      - name: Get Meta
        id: meta
        run: |
          echo REPO_NAME=$(echo ${GITHUB_REPOSITORY} | awk -F"/" '{print tolower($2)}') >> $GITHUB_OUTPUT
          echo SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #tag: v6.2.0
        with:
          images: ${{ env.DOCKER_ORG }}/${{ steps.meta.outputs.REPO_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: abell.registry.macslabs.de/docker
          username: ${{ secrets.DR_ABELL_USER }}
          password: ${{ secrets.DR_ABELL_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ env.DOCKER_ORG }}/${{ steps.meta.outputs.REPO_NAME }}-gha:${{ steps.meta.outputs.SHA_SHORT }}
